[package]
name = "kintara-server"
version = "1.12.0"
edition = "2024"
description = "Self-hosted document library server for Kintara"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
blake3 = "1.8.6"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
mime_guess = "2.0.5"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "compression-gzip", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.4"
tempfile = "3.27.0"
