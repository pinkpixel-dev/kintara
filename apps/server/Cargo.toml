[package]
name = "kintara-server"
version = "1.3.0"
edition = "2024"
description = "Self-hosted document library server for Kintara"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
blake3 = "1.8.6"
chrono = { version = "0.4.45", features = ["serde"] }
mime_guess = "2.0.5"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "compression-gzip", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.4"
tempfile = "3.27.0"
